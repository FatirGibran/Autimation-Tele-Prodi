name: Automation & Operational Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  operational-checks:
    name: Operational Scripts & SEO Verification
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Environment Doctor
      run: |
        python scripts/env_doctor.py --json

    - name: Run Bulk SEO Audit
      run: |
        python scripts/bulk_audit.py

    - name: Run Database Backup Test
      run: |
        python -c "from storage import StorageManager; StorageManager('editorial.db')"
        python scripts/backup_db.py --db editorial.db --dest /tmp/backups
